<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="description" content="Review your Atelier June bag and complete secure checkout.">
    <title>Checkout — Atelier June</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/src/checkout.js"></script>
  </head>
  <body class="checkout-page">
    <div class="announcement">Complimentary delivery on orders over ₦100,000</div>
    <header class="site-header checkout-header">
      <a class="wordmark" href="/">atelier <span>june</span><i>®</i></a>
      <a class="text-link" href="/">Continue shopping <span>↗</span></a>
    </header>
    <main class="checkout-main">
      <div class="checkout-title"><p class="eyebrow">A FEW DETAILS AND YOU’RE DONE</p><h1>Checkout.</h1><p>Your pieces are nearly home.</p></div>
      <div id="checkout-notice" class="checkout-notice" role="status" aria-live="polite"></div>
      <div class="checkout-layout">
        <section class="checkout-card">
          <div id="checkout-content"><p class="form-hint">Loading your bag…</p></div>
        </section>
        <aside class="checkout-card order-summary" aria-labelledby="summary-title">
          <h2 id="summary-title">Your order.</h2>
          <div id="checkout-items"></div>
          <div id="checkout-total"></div>
        </aside>
      </div>
    </main>
    <footer class="site-footer"><a class="wordmark" href="/">atelier <span>june</span><i>®</i></a><span>Secure payment hosted by Paystack.</span><span class="prototype-note">NGN checkout · shipping not connected</span></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
